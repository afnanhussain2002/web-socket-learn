<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>WebSocket Server Demo</h1>
    <div>
        <!-- Where the user types a message -->
        <input type="text"
        placeholder="Enter your message here"
        id="message-input"
        />
        <!-- Click to send the typed message -->
        <button id="message-send-button">Send</button>
        <!-- Received messages get added here as list items -->
        <ul id="messages-container"></ul>
    </div>
    <script>
        // --- Grab the DOM elements we need ---
        const messageInput = document.getElementById('message-input');
        const messageSendButton = document.getElementById('message-send-button');
        const messagesContainer = document.getElementById('messages-container');

        // Open a WebSocket connection back to the server that served this page.
        // We reuse the current page's port so it works on any host/port.
        const { port } = window.location;
        const connection = new WebSocket(`ws://localhost:${port}`);

        // onopen fires once the connection handshake is complete and the
        // connection is ready to send/receive. We set everything up inside it.
        connection.onopen = () => {

            // Called every time the server pushes a message to this client.
            connection.onmessage = (message) => {
                console.log(`Message Received:`, message);

                // Messages are sent as JSON strings like {"message":"hi"},
                // so we parse the string back into an object.
                const rawData = message.data;
                const parsedData = JSON.parse(rawData);
                const text = parsedData.message;

                // Add the message text to the list on screen.
                const li = document.createElement('li');
                li.innerText = text;
                messagesContainer.appendChild(li);
            };

            // When the Send button is clicked, send the input's value to the
            // server as a JSON string. The server publishes it to Redis, which
            // broadcasts it back to every connected client (including us).
            messageSendButton.addEventListener('click', (ev) => {
                const value = messageInput.value;
                connection.send(JSON.stringify({ message: value }));
            });
        };
    </script>
</body>
</html>
